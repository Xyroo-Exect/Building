name: Build APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL ZIP project Flutter"
        required: true
        type: string

      tag:
        description: "Build tag"
        required: true
        type: string

      build_type:
        description: "Build type"
        required: true
        type: choice
        options:
          - release
          - debug
        default: release

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # ==============================
      # CHECKOUT
      # ==============================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==============================
      # JAVA 17
      # ==============================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ==============================
      # FLUTTER
      # ==============================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      # ==============================
      # CHECK ENVIRONMENT
      # ==============================
      - name: Check Flutter
        run: |
          flutter --version
          dart --version
          java -version

      # ==============================
      # PREPARE
      # ==============================
      - name: Prepare directories
        run: |
          rm -rf project
          rm -rf output
          mkdir -p project
          mkdir -p output

      # ==============================
      # DOWNLOAD ZIP
      # ==============================
      - name: Download Flutter project
        env:
          ZIP_URL: ${{ inputs.zip_url }}
        run: |
          echo "Downloading project..."

          curl -fL \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 600 \
            "$ZIP_URL" \
            -o project.zip

          ls -lh project.zip

      # ==============================
      # EXTRACT
      # ==============================
      - name: Extract project
        run: |
          unzip -q project.zip -d project

          echo "Extracted files:"
          find project -maxdepth 3 -type f | head -100

      # ==============================
      # FIND FLUTTER PROJECT
      # ==============================
      - name: Find Flutter project
        run: |
          PUBSPEC=$(find project -name "pubspec.yaml" -type f | head -1)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml tidak ditemukan."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "Flutter project ditemukan:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ==============================
      # FLUTTER PUB GET
      # ==============================
      - name: Flutter Pub Get
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter clean || true
          flutter pub get

      # ==============================
      # BUILD RELEASE
      # ==============================
      - name: Build Release APK
        if: inputs.build_type == 'release'
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter build apk --release

      # ==============================
      # BUILD DEBUG
      # ==============================
      - name: Build Debug APK
        if: inputs.build_type == 'debug'
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter build apk --debug

      # ==============================
      # COLLECT APK
      # ==============================
      - name: Collect APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "Searching APK..."

          find build/app/outputs/flutter-apk \
            -type f \
            -name "*.apk" \
            -exec cp {} "$GITHUB_WORKSPACE/output/" \;

          echo "APK output:"
          ls -lah "$GITHUB_WORKSPACE/output"

          if ! find "$GITHUB_WORKSPACE/output" -type f -name "*.apk" | grep -q .; then
            echo "ERROR: APK tidak ditemukan."
            exit 1
          fi

      # ==============================
      # RENAME APK
      # ==============================
      - name: Rename APK
        env:
          BUILD_TAG: ${{ inputs.tag }}
        run: |
          APK=$(find output -type f -name "*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            exit 1
          fi

          mv "$APK" "output/${BUILD_TAG}.apk"

          echo "Final APK:"
          ls -lah output

      # ==============================
      # UPLOAD ARTIFACT
      # ==============================
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.tag }}
          path: output/*.apk
          if-no-files
            echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          fi

      - name: Flutter Pub Get
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Build APK Release
        if: inputs.build_type == 'release'
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      - name: Build APK Debug
        if: inputs.build_type == 'debug'
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --debug

      - name: Collect APK
        run: |
          mkdir -p output
          find "${PROJECT_DIR}/build/app/outputs/flutter-apk" \
            -type f \
            -name "*.apk" \
            -exec cp {} output/ \;

          ls -lah output

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.tag }}
          path: output/*.apk
          if-no-files-found: error
          retention-days: 1
