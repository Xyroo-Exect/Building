name: Build APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL ZIP project Flutter / GitHub Release Asset"
        required: true
        type: string

      tag:
        description: "Build tag"
        required: true
        type: string

      build_type:
        description: "Build type"
        required: true
        type: choice
        options:
          - release
          - debug
        default: release

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # JAVA 17
      # ==========================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check Java
        run: |
          set -e

          echo "======================================"
          echo "JAVA"
          echo "======================================"

          java -version

          echo ""
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"

      # ==========================================
      # FLUTTER
      # ==========================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable

      - name: Check Flutter
        run: |
          set -e

          echo "======================================"
          echo "FLUTTER"
          echo "======================================"

          flutter --version

          echo ""
          echo "DART:"
          dart --version

          echo ""
          echo "JAVA:"
          java -version

      # ==========================================
      # PREPARE
      # ==========================================

      - name: Prepare directories
        run: |
          set -e

          echo "======================================"
          echo "PREPARE DIRECTORIES"
          echo "======================================"

          rm -rf project
          rm -rf output
          rm -f project.zip

          mkdir -p project
          mkdir -p output

          echo "Directories ready."

      # ==========================================
      # DOWNLOAD ZIP
      # ==========================================

      - name: Download Flutter project
        env:
          ZIP_URL: ${{ inputs.zip_url }}
          GH_TOKEN: ${{ secrets.BUILD_TOKEN }}
        run: |
          set -e

          echo "======================================"
          echo "DOWNLOAD FLUTTER PROJECT"
          echo "======================================"

          if [ -z "$ZIP_URL" ]; then
            echo "ERROR: ZIP_URL kosong."
            exit 1
          fi

          if [ -z "$GH_TOKEN" ]; then
            echo "ERROR: BUILD_TOKEN belum dikonfigurasi."
            echo ""
            echo "Buat:"
            echo "Settings"
            echo "-> Secrets and variables"
            echo "-> Actions"
            echo "-> New repository secret"
            echo ""
            echo "Name: BUILD_TOKEN"
            exit 1
          fi

          echo "Downloading project..."

          curl -fL \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 600 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$ZIP_URL" \
            -o project.zip

          echo ""
          echo "Downloaded:"
          ls -lh project.zip

          echo ""
          echo "File type:"
          file project.zip

          echo ""
          echo "Checking ZIP..."

          if ! unzip -t project.zip >/dev/null 2>&1; then
            echo "ERROR: File yang didownload bukan ZIP valid."
            echo ""
            echo "Response:"
            head -c 500 project.zip || true
            exit 1
          fi

          echo "ZIP VALID."

      # ==========================================
      # EXTRACT
      # ==========================================

      - name: Extract project
        run: |
          set -e

          echo "======================================"
          echo "EXTRACT PROJECT"
          echo "======================================"

          unzip -q project.zip -d project

          echo ""
          echo "Extracted files:"
          find project -maxdepth 4 -type f | head -200

      # ==========================================
      # FIX GRADLE PERMISSION
      # ==========================================

      - name: Fix Gradle Permissions
        run: |
          set -e

          echo "======================================"
          echo "FIX GRADLE PERMISSIONS"
          echo "======================================"

          GRADLEW_FILES=$(find project \
            -type f \
            -path "*/android/gradlew")

          if [ -z "$GRADLEW_FILES" ]; then
            echo "WARNING: android/gradlew tidak ditemukan."
            echo "Flutter project mungkin menggunakan struktur berbeda."
          else
            echo "gradlew ditemukan:"

            echo "$GRADLEW_FILES"

            while IFS= read -r GRADLEW; do
              if [ -n "$GRADLEW" ]; then
                echo ""
                echo "Fixing:"
                echo "$GRADLEW"

                chmod +x "$GRADLEW"

                echo "Permission:"
                ls -lh "$GRADLEW"
              fi
            done <<< "$GRADLEW_FILES"
          fi

          echo ""
          echo "Gradle permission fix selesai."

      # ==========================================
      # FIND FLUTTER PROJECT
      # ==========================================

      - name: Find Flutter project
        run: |
          set -e

          echo "======================================"
          echo "FIND FLUTTER PROJECT"
          echo "======================================"

          PUBSPEC=$(find project \
            -type f \
            -name "pubspec.yaml" \
            -print -quit)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml tidak ditemukan."

            echo ""
            echo "Project contents:"
            find project -maxdepth 5 -type f | head -300

            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo ""
          echo "Flutter project ditemukan:"
          echo "$PROJECT_DIR"

          echo ""
          echo "Project files:"
          ls -lah "$PROJECT_DIR"

          echo ""
          echo "Saving PROJECT_DIR..."

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ==========================================
      # CHECK GRADLE WRAPPER
      # ==========================================

      - name: Check Gradle Wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "======================================"
          echo "CHECK GRADLE WRAPPER"
          echo "======================================"

          if [ -f "android/gradlew" ]; then

            echo "gradlew ditemukan."

            chmod +x android/gradlew

            echo ""
            echo "Permission:"
            ls -lh android/gradlew

            echo ""
            echo "Testing wrapper:"
            ./android/gradlew --version

          else

            echo "WARNING: android/gradlew tidak ditemukan."

          fi

      # ==========================================
      # FLUTTER CLEAN
      # ==========================================

      - name: Flutter Clean
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "======================================"
          echo "FLUTTER CLEAN"
          echo "======================================"

          flutter clean || true

      # ==========================================
      # PUB GET
      # ==========================================

      - name: Flutter Pub Get
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "======================================"
          echo "FLUTTER PUB GET"
          echo "======================================"

          flutter pub get

      # ==========================================
      # BUILD RELEASE
      # ==========================================

      - name: Build Release APK
        if: inputs.build_type == 'release'
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "======================================"
          echo "BUILD RELEASE APK"
          echo "======================================"

          flutter build apk --release

      # ==========================================
      # BUILD DEBUG
      # ==========================================

      - name: Build Debug APK
        if: inputs.build_type == 'debug'
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "======================================"
          echo "BUILD DEBUG APK"
          echo "======================================"

          flutter build apk --debug

      # ==========================================
      # COLLECT APK
      # ==========================================

      - name: Collect APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "======================================"
          echo "COLLECT APK"
          echo "======================================"

          echo "Searching APK..."

          find build \
            -type f \
            -name "*.apk" \
            -print || true

          APK_COUNT=$(find build \
            -type f \
            -name "*.apk" \
            | wc -l)

          echo ""
          echo "APK count: $APK_COUNT"

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: APK tidak ditemukan."

            echo ""
            echo "Build directory:"
            find build -maxdepth 8 -type f 2>/dev/null | head -300 || true

            exit 1
          fi

          find build \
            -type f \
            -name "*.apk" \
            -exec cp {} "$GITHUB_WORKSPACE/output/" \;

          echo ""
          echo "APK output:"
          ls -lah "$GITHUB_WORKSPACE/output"

      # ==========================================
      # RENAME APK
      # ==========================================

      - name: Rename APK
        env:
          BUILD_TAG: ${{ inputs.tag }}
        run: |
          set -e

          echo "======================================"
          echo "RENAME APK"
          echo "======================================"

          APK=$(find output \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            exit 1
          fi

          SAFE_TAG=$(echo "$BUILD_TAG" | \
            sed 's/[^a-zA-Z0-9._-]/_/g')

          if [ -z "$SAFE_TAG" ]; then
            SAFE_TAG="build"
          fi

          mv "$APK" "output/${SAFE_TAG}.apk"

          echo ""
          echo "Final APK:"
          ls -lah output

      # ==========================================
      # VERIFY APK
      # ==========================================

      - name: Verify APK
        run: |
          set -e

          echo "======================================"
          echo "VERIFY APK"
          echo "======================================"

          APK=$(find output \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: Final APK tidak ditemukan."
            exit 1
          fi

          echo "APK:"
          echo "$APK"

          echo ""
          echo "Size:"
          du -h "$APK"

          echo ""
          echo "File:"
          file "$APK"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK kosong."
            exit 1
          fi

          echo ""
          echo "APK verification berhasil."

      # ==========================================
      # UPLOAD ARTIFACT
      # ==========================================

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.tag }}
          path: output/*.apk
          if-no-files-found: error
          retention-days: 3

      # ==========================================
      # BUILD SUMMARY
      # ==========================================

      - name: Build Summary
        if: success()
        env:
          BUILD_TAG: ${{ inputs.tag }}
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          echo "## APK Build Success" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Tag:** $BUILD_TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "**Build Type:** $BUILD_TYPE" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### APK" >> "$GITHUB_STEP_SUMMARY"
          ls -lh output/*.apk >> "$GITHUB_STEP_SUMMARY"
