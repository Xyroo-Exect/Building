name: Build APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL ZIP project Flutter / GitHub Release Asset"
        required: true
        type: string

      tag:
        description: "Build tag"
        required: true
        type: string

      build_type:
        description: "Build type"
        required: true
        type: choice
        options:
          - release
          - debug
        default: release

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # JAVA 17
      # ==========================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check Java
        run: |
          set -e

          echo "======================================"
          echo "JAVA"
          echo "======================================"

          java -version
          echo ""
          echo "JAVA_HOME=$JAVA_HOME"

      # ==========================================
      # FLUTTER
      # ==========================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable

      - name: Check Flutter
        run: |
          set -e

          echo "======================================"
          echo "FLUTTER"
          echo "======================================"

          flutter --version
          echo ""
          dart --version
          echo ""
          java -version

      # ==========================================
      # PREPARE
      # ==========================================

      - name: Prepare directories
        run: |
          set -e

          rm -rf project
          rm -rf output
          rm -f project.zip

          mkdir -p project
          mkdir -p output

      # ==========================================
      # DOWNLOAD
      # ==========================================

      - name: Download Flutter project
        env:
          ZIP_URL: ${{ inputs.zip_url }}
          GH_TOKEN: ${{ secrets.BUILD_TOKEN }}
        run: |
          set -e

          echo "======================================"
          echo "DOWNLOAD FLUTTER PROJECT"
          echo "======================================"

          if [ -z "$ZIP_URL" ]; then
            echo "ERROR: ZIP_URL kosong."
            exit 1
          fi

          if [ -z "$GH_TOKEN" ]; then
            echo "ERROR: BUILD_TOKEN belum dikonfigurasi."
            exit 1
          fi

          curl -fL \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 600 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$ZIP_URL" \
            -o project.zip

          echo ""
          echo "Downloaded:"
          ls -lh project.zip

          echo ""
          echo "Checking ZIP..."

          if ! unzip -t project.zip >/dev/null 2>&1; then
            echo "ERROR: Download bukan ZIP valid."
            exit 1
          fi

          echo "ZIP valid."

      # ==========================================
      # EXTRACT
      # ==========================================

      - name: Extract project
        run: |
          set -e

          echo "======================================"
          echo "EXTRACT PROJECT"
          echo "======================================"

          unzip -q project.zip -d project

          echo ""
          echo "Project files:"
          find project -maxdepth 4 -type f | head -200

      # ==========================================
      # FIX ALL SCRIPT PERMISSIONS
      # ==========================================

      - name: Fix Project Permissions
        run: |
          set -e

          echo "======================================"
          echo "FIX PROJECT PERMISSIONS"
          echo "======================================"

          echo "Searching Gradle wrappers..."

          find project \
            -type f \
            -path "*/android/gradlew" \
            -print

          echo ""
          echo "Setting executable permission..."

          find project \
            -type f \
            -path "*/android/gradlew" \
            -exec chmod 755 {} \;

          echo ""
          echo "Checking permissions..."

          find project \
            -type f \
            -path "*/android/gradlew" \
            -exec ls -l {} \;

          echo ""
          echo "Checking Gradle wrapper files..."

          while IFS= read -r GRADLEW; do
            if [ -n "$GRADLEW" ]; then

              echo ""
              echo "File: $GRADLEW"

              if [ ! -r "$GRADLEW" ]; then
                echo "ERROR: gradlew tidak bisa dibaca."
                exit 1
              fi

              if [ ! -x "$GRADLEW" ]; then
                echo "ERROR: gradlew tidak executable."
                exit 1
              fi

              echo "OK"

            fi
          done < <(
            find project \
              -type f \
              -path "*/android/gradlew"
          )

      # ==========================================
      # FIND FLUTTER PROJECT
      # ==========================================

      - name: Find Flutter project
        run: |
          set -e

          echo "======================================"
          echo "FIND FLUTTER PROJECT"
          echo "======================================"

          PUBSPEC=$(find project \
            -type f \
            -name "pubspec.yaml" \
            -print -quit)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml tidak ditemukan."

            echo ""
            echo "Project contents:"
            find project -maxdepth 5 -type f | head -300

            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo ""
          echo "Flutter project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ==========================================
      # FIX GRADLE PERMISSION INSIDE PROJECT
      # ==========================================

      - name: Prepare Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "======================================"
          echo "PREPARE GRADLE"
          echo "======================================"

          if [ -f "android/gradlew" ]; then

            echo "Before:"
            ls -l android/gradlew

            chmod 755 android/gradlew

            echo ""
            echo "After:"
            ls -l android/gradlew

            if [ ! -x android/gradlew ]; then
              echo "ERROR: android/gradlew masih tidak executable."
              exit 1
            fi

            echo ""
            echo "Gradle wrapper permission OK."

          else

            echo "ERROR: android/gradlew tidak ditemukan."
            exit 1

          fi

      # ==========================================
      # FLUTTER CLEAN
      # ==========================================

      - name: Flutter Clean
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "======================================"
          echo "FLUTTER CLEAN"
          echo "======================================"

          flutter clean || true

      # ==========================================
      # PUB GET
      # ==========================================

      - name: Flutter Pub Get
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "======================================"
          echo "FLUTTER PUB GET"
          echo "======================================"

          flutter pub get

      # ==========================================
      # RELEASE
      # ==========================================

      - name: Build Release APK
        if: inputs.build_type == 'release'
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "======================================"
          echo "BUILD RELEASE APK"
          echo "======================================"

          chmod 755 android/gradlew

          flutter build apk --release

      # ==========================================
      # DEBUG
      # ==========================================

      - name: Build Debug APK
        if: inputs.build_type == 'debug'
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "======================================"
          echo "BUILD DEBUG APK"
          echo "======================================"

          chmod 755 android/gradlew

          flutter build apk --debug

      # ==========================================
      # COLLECT APK
      # ==========================================

      - name: Collect APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "======================================"
          echo "COLLECT APK"
          echo "======================================"

          echo "Searching APK..."

          find build \
            -type f \
            -name "*.apk" \
            -print || true

          APK_COUNT=$(find build \
            -type f \
            -name "*.apk" \
            | wc -l)

          echo ""
          echo "APK count: $APK_COUNT"

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: APK tidak ditemukan."

            echo ""
            echo "Build directory:"
            find build -maxdepth 8 -type f 2>/dev/null | head -300 || true

            exit 1
          fi

          find build \
            -type f \
            -name "*.apk" \
            -exec cp {} "$GITHUB_WORKSPACE/output/" \;

          echo ""
          echo "Output:"
          ls -lah "$GITHUB_WORKSPACE/output"

      # ==========================================
      # RENAME
      # ==========================================

      - name: Rename APK
        env:
          BUILD_TAG: ${{ inputs.tag }}
        run: |
          set -e

          echo "======================================"
          echo "RENAME APK"
          echo "======================================"

          APK=$(find output \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            exit 1
          fi

          SAFE_TAG=$(echo "$BUILD_TAG" | \
            sed 's/[^a-zA-Z0-9._-]/_/g')

          if [ -z "$SAFE_TAG" ]; then
            SAFE_TAG="build"
          fi

          mv "$APK" "output/${SAFE_TAG}.apk"

          echo ""
          echo "Final APK:"
          ls -lah output

      # ==========================================
      # VERIFY
      # ==========================================

      - name: Verify APK
        run: |
          set -e

          echo "======================================"
          echo "VERIFY APK"
          echo "======================================"

          APK=$(find output \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            exit 1
          fi

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK kosong."
            exit 1
          fi

          echo "APK:"
          echo "$APK"

          echo ""
          echo "Size:"
          du -h "$APK"

          echo ""
          echo "File:"
          file "$APK"

          echo ""
          echo "APK verification berhasil."

      # ==========================================
      # UPLOAD
      # ==========================================

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.tag }}
          path: output/*.apk
          if-no-files-found: error
          retention-days: 3

      # ==========================================
      # SUMMARY
      # ==========================================

      - name: Build Summary
        if: success()
        env:
          BUILD_TAG: ${{ inputs.tag }}
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          echo "## APK Build Success" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Tag:** $BUILD_TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "**Build Type:** $BUILD_TYPE" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### APK" >> "$GITHUB_STEP_SUMMARY"
          ls -lh output/*.apk >> "$GITHUB_STEP_SUMMARY"
