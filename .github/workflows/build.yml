name: Build APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL ZIP project Flutter / GitHub Release Asset"
        required: true
        type: string

      tag:
        description: "Build tag"
        required: true
        type: string

      build_type:
        description: "Build type"
        required: true
        type: choice
        options:
          - release
          - debug
        default: release

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # JAVA
      # ==========================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check Java
        run: |
          echo "Java:"
          java -version

          echo ""
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"

      # ==========================================
      # FLUTTER
      # ==========================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable

      - name: Check Flutter
        run: |
          echo "Flutter:"
          flutter --version

          echo ""
          echo "Dart:"
          dart --version

          echo ""
          echo "Java:"
          java -version

      # ==========================================
      # PREPARE
      # ==========================================

      - name: Prepare directories
        run: |
          rm -rf project
          rm -rf output
          rm -f project.zip

          mkdir -p project
          mkdir -p output

      # ==========================================
      # DOWNLOAD PROJECT
      # ==========================================

      - name: Download Flutter project
        env:
          ZIP_URL: ${{ inputs.zip_url }}
          GH_TOKEN: ${{ secrets.BUILD_TOKEN }}
        run: |
          set -e

          echo "======================================"
          echo "Downloading Flutter project"
          echo "======================================"

          if [ -z "$ZIP_URL" ]; then
            echo "ERROR: ZIP_URL kosong."
            exit 1
          fi

          if [ -z "$GH_TOKEN" ]; then
            echo "ERROR: BUILD_TOKEN belum dikonfigurasi."
            echo "Buat repository secret bernama BUILD_TOKEN."
            exit 1
          fi

          echo "URL:"
          echo "$ZIP_URL"

          curl -fL \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 600 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$ZIP_URL" \
            -o project.zip

          echo ""
          echo "Downloaded file:"
          ls -lh project.zip

          echo ""
          echo "File type:"
          file project.zip

          echo ""
          echo "Checking ZIP..."

          if ! unzip -t project.zip >/dev/null 2>&1; then
            echo "ERROR: File yang didownload bukan ZIP valid."

            echo ""
            echo "First bytes:"
            head -c 500 project.zip || true

            exit 1
          fi

          echo "ZIP valid."

      # ==========================================
      # EXTRACT
      # ==========================================

      - name: Extract project
        run: |
          set -e

          echo "Extracting project..."

          unzip -q project.zip -d project

          echo ""
          echo "Extracted files:"
          find project -maxdepth 4 -type f | head -100

      # ==========================================
      # FIND FLUTTER PROJECT
      # ==========================================

      - name: Find Flutter project
        run: |
          set -e

          echo "Searching pubspec.yaml..."

          PUBSPEC=$(find project \
            -type f \
            -name "pubspec.yaml" \
            -print -quit)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml tidak ditemukan."

            echo ""
            echo "Project contents:"
            find project -maxdepth 4 -type f | head -200

            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo ""
          echo "Flutter project ditemukan:"
          echo "$PROJECT_DIR"

          echo ""
          echo "Project files:"
          ls -lah "$PROJECT_DIR"

          echo ""
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ==========================================
      # FLUTTER PUB GET
      # ==========================================

      - name: Flutter Pub Get
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "======================================"
          echo "Flutter Clean"
          echo "======================================"

          flutter clean || true

          echo ""
          echo "======================================"
          echo "Flutter Pub Get"
          echo "======================================"

          flutter pub get

      # ==========================================
      # BUILD RELEASE
      # ==========================================

      - name: Build Release APK
        if: inputs.build_type == 'release'
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "======================================"
          echo "Building RELEASE APK"
          echo "======================================"

          flutter build apk --release

      # ==========================================
      # BUILD DEBUG
      # ==========================================

      - name: Build Debug APK
        if: inputs.build_type == 'debug'
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "======================================"
          echo "Building DEBUG APK"
          echo "======================================"

          flutter build apk --debug

      # ==========================================
      # COLLECT APK
      # ==========================================

      - name: Collect APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "======================================"
          echo "Searching APK"
          echo "======================================"

          APK_COUNT=$(find build/app/outputs/flutter-apk \
            -type f \
            -name "*.apk" \
            | wc -l)

          echo "APK ditemukan: $APK_COUNT"

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: APK tidak ditemukan."

            echo ""
            echo "Build directory:"
            find build -maxdepth 6 -type f 2>/dev/null | head -200 || true

            exit 1
          fi

          find build/app/outputs/flutter-apk \
            -type f \
            -name "*.apk" \
            -exec cp {} "$GITHUB_WORKSPACE/output/" \;

          echo ""
          echo "APK output:"
          ls -lah "$GITHUB_WORKSPACE/output"

      # ==========================================
      # RENAME APK
      # ==========================================

      - name: Rename APK
        env:
          BUILD_TAG: ${{ inputs.tag }}
        run: |
          set -e

          APK=$(find output \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            exit 1
          fi

          SAFE_TAG=$(echo "$BUILD_TAG" | \
            sed 's/[^a-zA-Z0-9._-]/_/g')

          if [ -z "$SAFE_TAG" ]; then
            SAFE_TAG="build"
          fi

          mv "$APK" "output/${SAFE_TAG}.apk"

          echo ""
          echo "Final APK:"
          ls -lah output

      # ==========================================
      # VERIFY APK
      # ==========================================

      - name: Verify APK
        run: |
          set -e

          APK=$(find output \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: Final APK tidak ditemukan."
            exit 1
          fi

          echo "APK:"
          echo "$APK"

          echo ""
          echo "Size:"
          du -h "$APK"

          echo ""
          echo "File:"
          file "$APK"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK kosong."
            exit 1
          fi

          echo ""
          echo "APK verification berhasil."

      # ==========================================
      # UPLOAD ARTIFACT
      # ==========================================

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.tag }}
          path: output/*.apk
          if-no-files-found: error
          retention-days: 3

      # ==========================================
      # SUMMARY
      # ==========================================

      - name: Build Summary
        env:
          BUILD_TAG: ${{ inputs.tag }}
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          echo "## APK Build Success" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Tag:** $BUILD_TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "**Build Type:** $BUILD_TYPE" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### APK" >> "$GITHUB_STEP_SUMMARY"
          ls -lh output/*.apk >> "$GITHUB_STEP_SUMMARY"
